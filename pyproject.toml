[project]
name = "robustness-benchmark"
version = "0.1.0"
description = "Stress tests for robust counterfactual explanations under model change"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gurobipy==11.0.1",
    "lime>=0.2.0.1,<0.3",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "tabulate>=0.9,<1",
    "torch>=2.4,<3",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
